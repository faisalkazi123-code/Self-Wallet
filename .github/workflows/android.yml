name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Optional release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using private release key"
          else
            echo "Using bundled community key"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }}

      # Google Play needs an App Bundle signed with YOUR private upload key (never the public
      # community key). It is only built when the PLAY_* secrets are set; see docs/google-play/README.md.
      - name: Play upload key
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PLAY_KEYSTORE_BASE64" ]; then
            echo "$PLAY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/play.jks"
            echo "PLAY_KEYSTORE_PATH=$RUNNER_TEMP/play.jks" >> "$GITHUB_ENV"
          else
            echo "No PLAY_KEYSTORE_BASE64 secret: skipping the Google Play bundle"
          fi

      - name: Build Play bundle (AAB)
        if: env.PLAY_KEYSTORE_PATH != ''
        env:
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundlePlay -PversionCode=${{ github.run_number }}

      - name: Upload Play bundle
        if: env.PLAY_KEYSTORE_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: SelfWallet-google-play-aab
          path: app/build/outputs/bundle/play/*.aab

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/SelfWallet-1.0.${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/SelfWallet.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: SelfWallet-apk
          path: dist/SelfWallet-1.0.${{ github.run_number }}.apk

      # Every push to the default branch (or a v* tag) publishes a GitHub Release with the APK,
      # so anyone can download it from the repository's Releases page.
      - name: Publish release
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Self Wallet ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}
          make_latest: true
          body: |
            **Download `SelfWallet.apk` below and open it on your Android phone to install.**

            - Android 8.0 or newer
            - If asked, allow your browser/file manager to "Install unknown apps"
            - Updating: just install the newer APK over the old one — your data is kept

            Built from ${{ github.sha }}.
          files: |
            dist/SelfWallet.apk
            dist/SelfWallet-1.0.${{ github.run_number }}.apk
